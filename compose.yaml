name: housekeeping

services:
  postgres-dev:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: housekeeping_dev
      POSTGRES_PASSWORD: ${POSTGRES_DEV_PASSWORD:?Set POSTGRES_DEV_PASSWORD in .env}
      POSTGRES_DB: housekeeping_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housekeeping_dev -d housekeeping_dev"]
      interval: 2s
      timeout: 5s
      retries: 30

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: housekeeping_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Set POSTGRES_TEST_PASSWORD in .env}
      POSTGRES_DB: housekeeping_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housekeeping_test -d housekeeping_test"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-dev:
